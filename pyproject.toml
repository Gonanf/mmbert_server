[project]
name = "kateto-classifier-mmbert"
version = "0.1.0"
description = "mmBERT-based intent classifier server for Kateto (ONNX + Vulkan)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "onnxruntime-gpu>=1.20",
    "huggingface-hub>=0.27",
    "tokenizers>=0.21",
    "numpy>=2.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8"]
# train_heads.py corre con el python3 del sistema (tiene scikit-learn);
# sklearn no se necesita para SERVIR (las cabezas son npz lineales) y por eso
# vive en un grupo opcional, no en las dependencias de runtime.
train = ["scikit-learn>=1.5"]

[project.scripts]
kateto-classifier = "server:main"
